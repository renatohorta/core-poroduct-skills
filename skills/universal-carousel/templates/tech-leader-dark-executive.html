<!DOCTYPE html>
<!--
  Template: carrossel pessoal de líder de tech + IA — VERSÃO ESCURA EXECUTIVA.
  Paleta (DESIGN.md Versão A): bg #1B1B1D, text #FFFFFF, sec #B9B9BE, accent #A67561,
  border #2E2E31, card #232326. Fontes Montserrat (títulos) + Poppins (corpo).
  Uso: copie, troque os caminhos file:/// dos assets (foto + fonts) para o seu projeto,
  e injete a copy de cada slide. Renderize em 1080x1350 com Chrome headless.
  Para a versão "alegre" (creme #FFF6E9 + laranja #FF7A45), troque as variáveis de cor
  e os cards para branco arredondado — mesma estrutura.
-->
<html><head><meta charset="utf-8"><style>
@font-face { font-family:'Montserrat'; font-weight:400; src:url('file:///CAMINHO/assets/fonts/Montserrat-400.ttf'); }
@font-face { font-family:'Montserrat'; font-weight:500; src:url('file:///CAMINHO/assets/fonts/Montserrat-500.ttf'); }
@font-face { font-family:'Montserrat'; font-weight:600; src:url('file:///CAMINHO/assets/fonts/Montserrat-600.ttf'); }
@font-face { font-family:'Montserrat'; font-weight:700; src:url('file:///CAMINHO/assets/fonts/Montserrat-700.ttf'); }
@font-face { font-family:'Montserrat'; font-weight:800; src:url('file:///CAMINHO/assets/fonts/Montserrat-800.ttf'); }
@font-face { font-family:'Poppins'; font-weight:400; src:url('file:///CAMINHO/assets/fonts/Poppins-Regular.ttf'); }
@font-face { font-family:'Poppins'; font-weight:500; src:url('file:///CAMINHO/assets/fonts/Poppins-Medium.ttf'); }
@font-face { font-family:'Poppins'; font-weight:600; src:url('file:///CAMINHO/assets/fonts/Poppins-SemiBold.ttf'); }
@font-face { font-family:'Poppins'; font-weight:700; src:url('file:///CAMINHO/assets/fonts/Poppins-Bold.ttf'); }
@font-face { font-family:'Poppins'; font-weight:800; src:url('file:///CAMINHO/assets/fonts/Poppins-ExtraBold.ttf'); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body { background:#1B1B1D; color:#FFFFFF; font-family:'Poppins',sans-serif; position:relative; }

/* ---- barra superior comum (capa + internos) ---- */
.topbar { display:flex; justify-content:space-between; align-items:center; }
.brand { font-family:'Montserrat'; font-weight:700; font-size:26px; letter-spacing:1px; }
.brand span { color:#A67561; }
.pagenum { font-family:'Montserrat'; font-weight:700; font-size:24px; color:#A67561; }

/* ---- rodapé comum ---- */
.footer { position:absolute; bottom:0; left:0; right:0; padding:34px 80px;
  display:flex; justify-content:space-between; align-items:center; border-top:1px solid #2E2E31; }
.handle { font-family:'Montserrat'; font-weight:600; font-size:24px; color:#B9B9BE; }

/* ---- pill de gancho de comentário (1 por slide interno) ---- */
.hook { margin-top:auto; background:#232326; border:1px solid #2E2E31;
  border-left:6px solid #A67561; border-radius:14px; padding:22px 28px;
  display:flex; align-items:center; gap:18px; }
.hook .emoji { font-size:40px; }
.hook .txt { font-family:'Poppins'; font-weight:500; font-size:26px; color:#FFFFFF; }

/* ---- capa (slide 1) ---- */
.cover { position:absolute; inset:0; padding:70px 80px; display:flex; flex-direction:column; }
.eyebrow { font-family:'Montserrat'; font-weight:600; font-size:22px; letter-spacing:4px;
  color:#A67561; text-transform:uppercase; margin-top:90px; }
.title { font-family:'Montserrat'; font-weight:800; font-size:72px; line-height:1.12;
  margin-top:28px; max-width:820px; }
.title .hl { color:#A67561; }
.sub { font-family:'Poppins'; font-weight:400; font-size:30px; color:#B9B9BE;
  margin-top:34px; max-width:760px; line-height:1.5; }
.creds { display:flex; gap:16px; margin-top:auto; }
.cred { background:#232326; border:1px solid #2E2E31; border-radius:14px;
  padding:16px 22px; font-family:'Montserrat'; font-weight:600; font-size:20px; }
.cred b { color:#A67561; }
.photo-wrap { position:absolute; right:80px; top:150px; width:300px; height:300px;
  border-radius:50%; overflow:hidden; border:6px solid #A67561;
  box-shadow:0 0 0 10px #1B1B1D, 0 0 0 12px #2E2E31; }
.photo-wrap img { width:100%; height:100%; object-fit:cover; }

/* ---- slide interno genérico ---- */
.slide { position:absolute; inset:0; padding:70px 80px; display:flex; flex-direction:column; }
.slide .eyebrow { margin-top:70px; }
.slide .title { font-size:56px; }
.body { margin-top:40px; font-family:'Poppins'; font-weight:400; font-size:30px;
  color:#B9B9BE; line-height:1.6; max-width:860px; }
.body b { color:#FFFFFF; }

/* ---- slide de números (credibilidade) ---- */
.stats { display:flex; gap:24px; margin-top:50px; }
.stat { flex:1; background:#232326; border:1px solid #2E2E31; border-radius:18px;
  padding:34px 26px; text-align:center; }
.stat .num { font-family:'Montserrat'; font-weight:800; font-size:64px; color:#A67561; }
.stat .lbl { font-family:'Poppins'; font-weight:500; font-size:22px; color:#B9B9BE; margin-top:10px; line-height:1.3; }

/* ---- slide de camadas (framework) ---- */
.layers { display:flex; flex-direction:column; gap:20px; margin-top:46px; }
.layer { display:flex; align-items:center; gap:24px; background:#232326;
  border:1px solid #2E2E31; border-radius:16px; padding:26px 30px; }
.layer .ic { font-size:44px; }
.layer .lt { font-family:'Montserrat'; font-weight:700; font-size:30px; }
.layer .ld { font-family:'Poppins'; font-weight:400; font-size:22px; color:#B9B9BE; margin-top:4px; }

/* ---- CTA final (enxuto: título + subtítulo + botão + handle) ---- */
.cta { position:absolute; inset:0; padding:70px 80px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; }
.cta .title { font-size:64px; }
.btn { margin-top:56px; background:#A67561; color:#1B1B1D; font-family:'Montserrat';
  font-weight:800; font-size:30px; padding:24px 56px; border-radius:60px; }
</style></head><body>
<!-- injete aqui o layout do slide (cover / slide / stats / layers / cta) -->
</body></html>
