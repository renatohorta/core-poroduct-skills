name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The suite does not use an LLM credential (see tests/conftest.py): no secret is
# needed, and no test calls a provider's API.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the target of the development .venv; 3.13 catches regressions early.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv -r requirements-dev.txt

      - name: install.sh syntax
        run: bash -n scripts/install.sh

      - name: Dry-run propagation (deprecated, does not write to the real directories)
        env:
          HERMES_SKILLS_DIR: ${{ runner.temp }}/hermes-skills
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}/claude-skills
        run: bash scripts/install.sh --deprecated --dry-run

      - name: Test suite
        run: .venv/bin/python -m pytest -v

  # Runs the suite on the OS where the skills are actually used. Does not block
  # the merge: the Windows runner is slower and less stable than Linux, and the
  # value here is an early signal of platform-specific breakage (encoding, Git Bash).
  test-windows:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements-dev.txt

      - name: Test suite
        run: .venv/Scripts/python.exe -m pytest -v
