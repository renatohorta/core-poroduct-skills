name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A suíte não usa credencial de LLM (ver tests/conftest.py): nenhum segredo é
# necessário, e nenhum teste chama a API de um provedor.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 é o alvo do .venv de desenvolvimento; 3.13 pega regressão cedo.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv -r requirements-dev.txt

      - name: Sintaxe do install.sh
        run: bash -n scripts/install.sh

      - name: Propagação a seco (não escreve nos diretórios reais)
        env:
          HERMES_SKILLS_DIR: ${{ runner.temp }}/hermes-skills
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}/claude-skills
        run: bash scripts/install.sh --dry-run

      - name: Suíte de testes
        run: .venv/bin/python -m pytest -v

  # Roda a suíte no SO onde as skills são realmente usadas. Não bloqueia o
  # merge: o runner Windows é mais lento e instável que o Linux, e o valor aqui
  # é sinal precoce de quebra específica de plataforma (encoding, Git Bash).
  test-windows:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements-dev.txt

      - name: Suíte de testes
        run: .venv/Scripts/python.exe -m pytest -v
